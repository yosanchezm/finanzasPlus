server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated by edge-traefik; these headers apply to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed Vite assets never change for a given file name.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback; index.html must always be revalidated to pick up new deployments.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
